<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Pama 💙</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="page">
    <h1 class="title">
        A little something for Pama 💙
    </h1>
    <div class="envelope-container" id="envelope">
        <div class="envelope">
            <div class="card-wrapper" id="cardWrapper">
                <div class="card" id="card">
                    <div class="card-inside">
                        <div class="message">
                            <div class="heart">
                                💙
                            </div>
                            <h2>
                                Dear Pama,
                            </h2>
                            <p>
                                Happy Father's Day
                            </p>
                            <p>
                                Hope you have a lovely day!
                            </p>
                            <p class="love">
                                Love Mel, Gary, Kerrie, Kayla and Bradley 💙
                            </p>
                        </div>
                    </div>
                    <div class="card-front">
                        <div class="front-content">
                        <div class="letters" id="letters">
                                <div class="word">
                                    <span>H</span>
                                    <span>A</span>
                                    <span>P</span>
                                    <span>P</span>
                                    <span>Y</span>
                                </div>
                                <div class="word">
                                    <span>P</span>
                                    <span>A</span>
                                    <span>M</span>
                                    <span>A</span>
                                    <span>'</span>
                                    <span>S</span>
                                </div>
                                <div class="word">
                                    <span>D</span>
                                    <span>A</span>
                                    <span>Y</span>
                                </div>
                            </div>
                            <div class="tap-card">
                                Tap to open 💌
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="envelope-back"></div>
            <div class="envelope-flap"></div>
            <div class="envelope-front">
                <div class="envelope-heart">
                    💙
                </div>
                <p>
                    For Pama
                </p>
            </div>
        </div>
    </div>
    <p class="instructions" id="instructions">
        Tap the envelope to open 💌
    </p>
</div>
<script src="script.js"></script>
</body>
</html>
